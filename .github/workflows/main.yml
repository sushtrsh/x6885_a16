name: Recovery Build 14.1

on:
  workflow_dispatch:
    inputs:
      SYNC_URL:
        description: 'SYNC_URL'
        required: true
        default: 'https://gitlab.com/OrangeFox/sync.git'
      MANIFEST_BRANCH:
        description: 'MANIFEST_BRANCH (OrangeFox branch)'
        required: true
        default: '14.1'
      DEVICE_TREE_URL:
        description: 'DEVICE_TREE_URL'
        required: true
        default: 'https://github.com/sushtrsh/x6885_a16'
      DEVICE_TREE_BRANCH:
        description: 'DEVICE_TREE_BRANCH'
        required: true
        default: 'main'
      DEVICE_PATH:
        description: 'DEVICE_PATH'
        required: true
        default: 'device/infinix/X6885'
      DEVICE_NAME:
        description: 'DEVICE_NAME'
        required: true
        default: 'X6885'
      MAKEFILE_NAME:
        description: 'MAKEFILE_NAME (lunch: <MAKEFILE_NAME>-ap2a-eng)'
        required: true
        default: 'fox_X6885'
      BUILD_TARGET:
        description: 'BUILD_TARGET'
        required: true
        default: 'vendorboot'
      USE_CCACHE:
        description: 'Use ccache (restore + save)'
        required: true
        default: 'true'
        type: choice
        options:
          - true
          - false
      SNAPSHOT:
        description: 'Ambil snapshot sepolicy/patch (false kalau sudah ketemu)'
        required: true
        default: 'true'
        type: choice
        options:
          - true
          - false

jobs:
  build:
    if: github.event.repository.owner.id == github.event.sender.id
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:

    - name: Check Out
      uses: actions/checkout@v4

    - name: Cleanup
      uses: rokibhasansagar/slimhub_actions@main

    - name: Initialize workspace
      run: |
        mkdir workspace
        cd workspace
        echo "workspace-folder=$(pwd)" >> $GITHUB_OUTPUT
      id: pwd

    - name: Prepare the build environment
      run: |
        sudo apt update && sudo apt upgrade -y
        DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            git python3 tar aria2 patch ccache
        git clone https://gitlab.com/OrangeFox/misc/scripts
        cd scripts
        sudo bash setup/android_build_env.sh
        sed -i 's/cd -/cd ../g' setup/install_android_sdk.sh
        sudo bash setup/install_android_sdk.sh
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Install OpenJDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '11'

    - name: Setup SSH Keys
      if: ${{ startsWith(github.event.inputs.DEVICE_TREE_URL, 'git@github.com') }}
      uses: webfactory/ssh-agent@v0.9.0
      with:
          ssh-private-key: |
            ${{ secrets.SSH_PRIVATE_KEY }}

    - name: Sync OrangeFox sources and minimal manifest
      run: |
        cd ${{ steps.pwd.outputs.workspace-folder }}
        git clone ${{ github.event.inputs.SYNC_URL }}
        cd sync
        ./orangefox_sync.sh --branch ${{ github.event.inputs.MANIFEST_BRANCH }} --path ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Clone device tree
      run: |
        cd ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}
        git clone ${{ github.event.inputs.DEVICE_TREE_URL }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} ./${{ github.event.inputs.DEVICE_PATH }}
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Set Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 12

    - name: Workaround for missing repo projects.
      run : |
        cd ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}
        repo sync external/gflags
        repo sync external/guava
        repo sync hardware/google/interfaces
        repo sync hardware/google/pixel

    - name: Snapshot hasil sync (sebelum patch)
      if: always() && github.event.inputs.SNAPSHOT != 'false'
      run: |
        W="${{ steps.pwd.outputs.workspace-folder }}"
        FOX="$W/fox_${{ github.event.inputs.MANIFEST_BRANCH }}"
        DEV="$FOX/${{ github.event.inputs.DEVICE_PATH }}"
        S="$W/snapshot"
        mkdir -p "$S/originals" "$S/sepolicy"
        cd "$FOX"

        # 1. Revisi tiap project (bisa dipakai untuk mengunci build nanti)
        repo manifest -r -o "$S/manifest-pinned.xml" || true

        # 2. Versi yang dipakai
        {
          grep -m1 SCRIPT_VERSION "$W/sync/orangefox_sync.sh"
          git -C "$W/sync" log -1 --format='sync-repo %H'
          for p in system/sepolicy system/core bootable/recovery vendor/twrp; do
            echo "$p $(git -C $p log -1 --format='%H %cd' 2>/dev/null)"
          done
        } > "$S/versions.txt" 2>&1

        # 3. File asli dari SETIAP file yang disentuh patch-mu
        grep -h '^+++ b/' "$DEV"/patches/*.patch | sed 's#^+++ b/##' | sort -u > "$S/patched-files.txt"
        while read -r f; do
          if [ -f "$f" ]; then cp --parents "$f" "$S/originals/"; else echo "$f" >> "$S/missing-files.txt"; fi
        done < "$S/patched-files.txt"

        # 4. Dry-run semua patch sekarang, bukan setelah 20 menit build
        for p in "$DEV"/patches/*.patch; do
          if patch -p1 -N --dry-run --silent < "$p" >/dev/null 2>&1; then s=OK
          elif patch -p1 -R --dry-run --silent < "$p" >/dev/null 2>&1; then s=SUDAH-TER-APPLY
          else s=GAGAL; fi
          echo "$s $(basename "$p")"
          if [ "$s" = GAGAL ]; then patch -p1 -N --dry-run < "$p" 2>&1 | head -40; fi
        done > "$S/patch-dryrun.txt"
        cat "$S/patch-dryrun.txt"

        # 5a. system/sepolicy UTUH (private, public, vendor, prebuilts/api, mapping, tests, dsb.)
        tar --exclude=.git -czf "$S/sepolicy/system_sepolicy.tar.gz" system/sepolicy

        # 5b. SEMUA file policy di seluruh tree (bukan cuma system/sepolicy):
        #     *.te, *_contexts, *.cil, mapping, seapp_contexts, dll. Path asli dipertahankan.
        find . \( -path ./out -o -path ./.repo -o -path '*/.git' -o -path ./system/sepolicy \) -prune -o \
          -type f \( -name '*.te' -o -name '*_contexts' -o -name '*_contexts.*' -o -name '*.cil' \
                     -o -name 'mapping' -o -name '*.fc' -o -name 'sepolicy*.mk' -o -name 'SEPolicy.mk' \
                     -o -name 'ioctl_defines' -o -name 'initial_sid*' -o -name 'security_classes' \
                     -o -name 'access_vectors' -o -name 'global_macros' -o -name 'te_macros' \) \
          -print > "$S/sepolicy/other-policy-files.txt"
        tar -czf "$S/sepolicy/other_policy.tar.gz" -T "$S/sepolicy/other-policy-files.txt"

        # 5c. Variabel build yang menentukan policy mana yang ikut dikompilasi
        grep -rn "SEPOLICY_DIRS\|SEPOLICY_M4_DEFS\|BOARD_SEPOLICY\|PRODUCT_PRIVATE_SEPOLICY\|PRODUCT_PUBLIC_SEPOLICY\|SELINUX_IGNORE_NEVERALLOWS" \
          build/make/core build/make/target "$DEV" vendor/twrp system/sepolicy/*.mk system/sepolicy/Android.mk 2>/dev/null \
          > "$S/sepolicy/build-variables.txt" || true

        # 5d. Index cepat: semua neverallow, dan semua yang menyebut target yang sedang dikerjakan
        grep -rn "neverallow" system/sepolicy/private system/sepolicy/public > "$S/sepolicy/neverallow-index.txt" || true
        grep -rn "lpdump" . --include='*.te' --include='*_contexts' --include='*.cil' \
          --exclude-dir=out --exclude-dir=.git --exclude-dir=.repo > "$S/grep-lpdump.txt" || true

        # 6. Salinan tree device sebagaimana ter-clone
        git -C "$DEV" log -1 --format='%H %s' > "$S/device-commit.txt"

    - name: Restore ccache
      if: github.event.inputs.USE_CCACHE == 'true'
      id: ccache
      uses: actions/cache/restore@v4
      with:
        path: ~/.ccache
        key: ${{ runner.os }}-orangefox-ccache-${{ github.event.inputs.MANIFEST_BRANCH }}-${{ github.event.inputs.DEVICE_TREE_BRANCH }}-${{ github.run_id }}
        restore-keys: |
          ${{ runner.os }}-orangefox-ccache-${{ github.event.inputs.MANIFEST_BRANCH }}-${{ github.event.inputs.DEVICE_TREE_BRANCH }}-
          ${{ runner.os }}-orangefox-ccache-${{ github.event.inputs.MANIFEST_BRANCH }}-

    - name: Configure ccache
      if: github.event.inputs.USE_CCACHE == 'true'
      run: |
        mkdir -p "$HOME/.ccache"
        echo "USE_CCACHE=1" >> "$GITHUB_ENV"
        echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"
        echo "CCACHE_EXEC=$(command -v ccache)" >> "$GITHUB_ENV"
        ccache -M 10G
        ccache -z
        echo "Cache hit: ${{ steps.ccache.outputs.cache-hit }}"
        ccache -s

    - name: Building recovery
      id: build
      run: |
        set -o pipefail
        {
          cd ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}
          set +e
          source build/envsetup.sh
          source ${{ github.event.inputs.DEVICE_PATH }}/vendorsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          export FOX_USE_ZSTD_BINARY=1
          set -e
          lunch ${{ github.event.inputs.MAKEFILE_NAME }}-ap2a-eng && make clean && mka adbd ${{ github.event.inputs.BUILD_TARGET }}image -j$(nproc --all)
        } 2>&1 | tee "${{ steps.pwd.outputs.workspace-folder }}/build.log"
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}
      continue-on-error: true

    - name: Show ccache statistics
      if: always() && github.event.inputs.USE_CCACHE == 'true'
      run: |
        ccache -s
        du -sh "$HOME/.ccache" 2>/dev/null || true

    - name: Save ccache
      if: always() && github.event.inputs.USE_CCACHE == 'true' && steps.ccache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ~/.ccache
        key: ${{ steps.ccache.outputs.cache-primary-key }}

    - name: Check the output directory before uploading
      if: ${{ !cancelled() }}
      run: |
        ls -al ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/out/target/product/ || true
        echo
        ls -al ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/ || true
        echo
        ls -al ${{ steps.pwd.outputs.workspace-folder }}/build.log || true

    - name: Snapshot setelah build
      if: always() && github.event.inputs.SNAPSHOT != 'false'
      run: |
        W="${{ steps.pwd.outputs.workspace-folder }}"
        FOX="$W/fox_${{ github.event.inputs.MANIFEST_BRANCH }}"
        S="$W/snapshot"
        mkdir -p "$S/patched" "$S/out"
        cd "$FOX"

        # 1. Kondisi file SETELAH patch + selisihnya terhadap file asli
        if [ -f "$S/patched-files.txt" ]; then
          while read -r f; do [ -f "$f" ] && cp --parents "$f" "$S/patched/"; done < "$S/patched-files.txt"
          diff -ru "$S/originals" "$S/patched" > "$S/patch-effect.diff" || true
        fi

        # 2. Hasil kompilasi sepolicy (policy.conf, .cil, contexts, mapping) kalau sempat terbentuk
        if [ -d out ]; then
          find out \( -path '*/sepolicy*' -o -name 'policy.conf' -o -name '*.cil' \
                      -o -name 'plat_sepolicy*' -o -name 'precompiled_sepolicy*' \
                      -o -name '*_file_contexts*' -o -name '*_property_contexts*' \
                      -o -name '*_service_contexts*' -o -name '*_hwservice_contexts*' \) \
            -type f -size -20M ! -name '*.o' ! -name '*.d' ! -name '*.a' ! -name '*.so' \
            -print > "$S/out/sepolicy-files.txt" 2>/dev/null
          [ -s "$S/out/sepolicy-files.txt" ] && tar -czf "$S/out/sepolicy_build_out.tar.gz" -T "$S/out/sepolicy-files.txt"
        fi

        # 3. Isi ramdisk recovery yang terbentuk (kalau build sampai sana)
        P="out/target/product/${{ github.event.inputs.DEVICE_NAME }}"
        ls -laR "$P" 2>/dev/null | head -2000 > "$S/out/product-listing.txt" || true
        [ -d "$P/recovery/root" ] && tar -czf "$S/out/recovery_root_etc.tar.gz" \
          -C "$P/recovery/root" system/etc init.rc system/bin/init 2>/dev/null || true

        # 4. Pesan error build ringkas
        cp "$W/build.log" "$S/build.log" 2>/dev/null || true
        grep -n "FAILED\|neverallow\|error:" "$W/build.log" 2>/dev/null | head -200 > "$S/build-errors.txt" || true

    - name: Upload snapshot
      if: always() && github.event.inputs.SNAPSHOT != 'false'
      uses: actions/upload-artifact@v4
      with:
        name: snapshot-${{ github.run_id }}
        path: ${{ steps.pwd.outputs.workspace-folder }}/snapshot
        retention-days: 14

    - name: Upload to Release
      id: release
      if: ${{ !cancelled() }}
      uses: softprops/action-gh-release@v2
      with:
        files: |
          ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/OrangeFox-*.img
          ${{ steps.pwd.outputs.workspace-folder }}/build.log
        name: ${{ github.event.inputs.DEVICE_NAME }}-${{ github.run_id }}
        tag_name: ${{ github.run_id }}
        body: |
          Manifest: ${{ github.event.inputs.MANIFEST_BRANCH }}
          Device: ${{ github.event.inputs.DEVICE_NAME }}
          Target: ${{ github.event.inputs.BUILD_TARGET }}
          Build: ${{ steps.build.outcome }} (lihat build.log, cari "[X6885]" untuk status patch)
          Tested on 16.3.0.145SP08
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Kirim notifikasi ke Telegram
      if: always()
      env:
        TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        BUILD_STATUS: ${{ steps.build.outcome }}
        RELEASE_STATUS: ${{ steps.release.outcome }}
        RELEASE_URL: ${{ steps.release.outputs.url }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        DEVICE: ${{ github.event.inputs.DEVICE_NAME }}
        MANIFEST: ${{ github.event.inputs.MANIFEST_BRANCH }}
        TARGET: ${{ github.event.inputs.BUILD_TARGET }}
      run: |
        if [ "$BUILD_STATUS" = "success" ] && [ "$RELEASE_STATUS" = "success" ]; then
          TEXT=$(printf '✅ Build selesai\nDevice: %s\nManifest: %s\nTarget: %s\nRelease: %s' \
            "$DEVICE" "$MANIFEST" "$TARGET" "$RELEASE_URL")
        else
          TEXT=$(printf '❌ Build gagal\nDevice: %s\nLog: %s\nRelease (build.log): %s' "$DEVICE" "$RUN_URL" "$RELEASE_URL")
        fi
        curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
          --data-urlencode "chat_id=${CHAT_ID}" \
          --data-urlencode "text=${TEXT}"
